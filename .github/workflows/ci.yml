name: CI
on: [push, pull_request]

jobs:
  functions:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: functions } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: functions/package-lock.json }
      - run: npm ci
      - run: npm test

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      # CI has no Firebase project: use the documented placeholder so the google-services plugin can run.
      - run: cp app/google-services.json.example app/google-services.json
      - run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
